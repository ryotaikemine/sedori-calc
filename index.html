<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="せどり電卓">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f5f5f5">
<link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect width='180' height='180' rx='40' fill='%232563eb'/><text x='90' y='115' font-family='system-ui' font-size='90' font-weight='600' fill='white' text-anchor='middle'>¥</text></svg>">
<title>せどり仕入れ電卓</title>
<style>
:root {
  color-scheme: light dark;
  --bg-primary: #ffffff;
  --bg-secondary: #f5f5f5;
  --bg-tertiary: #fafafa;
  --text-primary: #1a1a1a;
  --text-secondary: #6b6b6b;
  --text-tertiary: #9a9a9a;
  --border: rgba(0,0,0,0.1);
  --border-strong: rgba(0,0,0,0.2);
  --success-bg: #d4edda;
  --success-text: #155724;
  --warning-bg: #fff3cd;
  --warning-text: #856404;
  --danger-bg: #f8d7da;
  --danger-text: #721c24;
  --info-bg: #cfe2ff;
  --info-text: #084298;
  --radius-md: 8px;
  --radius-lg: 12px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg-primary: #1c1c1e;
    --bg-secondary: #2c2c2e;
    --bg-tertiary: #3a3a3c;
    --text-primary: #f5f5f7;
    --text-secondary: #a1a1a6;
    --text-tertiary: #6e6e73;
    --border: rgba(255,255,255,0.1);
    --border-strong: rgba(255,255,255,0.2);
    --success-bg: #1e3a24;
    --success-text: #7bc689;
    --warning-bg: #3d3212;
    --warning-text: #e8c66c;
    --danger-bg: #3d1a1f;
    --danger-text: #e87b84;
    --info-bg: #1a2b48;
    --info-text: #6b9fd9;
  }
}

* { box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
  background: var(--bg-tertiary);
  color: var(--text-primary);
  margin: 0;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  min-height: 100vh;
  -webkit-tap-highlight-color: transparent;
}

.calc-root {
  max-width: 560px;
  margin: 0 auto;
  padding: 16px;
}

.calc-section {
  background: var(--bg-secondary);
  border-radius: var(--radius-lg);
  padding: 16px 20px;
  margin-bottom: 12px;
}

.calc-label {
  font-size: 13px;
  color: var(--text-secondary);
  margin-bottom: 4px;
  display: block;
}

.calc-row {
  display: flex;
  gap: 8px;
  align-items: center;
  margin-bottom: 12px;
}

.calc-row:last-child { margin-bottom: 0; }

.calc-row input {
  flex: 3;
  min-width: 0;
  font-size: 16px;
  padding: 10px 12px;
  background: var(--bg-primary);
  border: 0.5px solid var(--border);
  border-radius: var(--radius-md);
  color: var(--text-primary);
  font-family: inherit;
  outline: none;
  -webkit-appearance: none;
  appearance: none;
}

.calc-row input:focus {
  border-color: var(--border-strong);
  box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
}

.calc-row select {
  flex: 1;
  min-width: 0;
  max-width: 110px;
  font-size: 14px;
  padding: 10px 8px;
  background: var(--bg-primary);
  border: 0.5px solid var(--border);
  border-radius: var(--radius-md);
  color: var(--text-primary);
  font-family: inherit;
  outline: none;
  -webkit-appearance: none;
  appearance: none;
  background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%239a9a9a' stroke-width='1.5' fill='none'/%3E%3C/svg%3E");
  background-repeat: no-repeat;
  background-position: right 8px center;
  padding-right: 24px;
}

.calc-unit {
  font-size: 13px;
  color: var(--text-secondary);
  min-width: 20px;
  flex-shrink: 0;
}

.calc-section-title {
  font-size: 12px;
  font-weight: 500;
  color: var(--text-tertiary);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin: 0 0 12px;
}

.calc-result-card {
  background: var(--bg-primary);
  border-radius: var(--radius-lg);
  border: 0.5px solid var(--border);
  padding: 20px;
  margin-top: 8px;
}

.calc-limit-label {
  font-size: 13px;
  color: var(--text-secondary);
  margin: 0 0 4px;
}

.calc-limit-value {
  font-size: 32px;
  font-weight: 500;
  margin: 0 0 4px;
  color: var(--text-primary);
}

.calc-limit-meta {
  font-size: 12px;
  color: var(--text-tertiary);
  margin: 0;
}

.calc-divider {
  border: none;
  border-top: 0.5px solid var(--border);
  margin: 16px 0;
}

.calc-cost-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 4px;
  font-size: 14px;
}

.calc-cost-meta {
  font-size: 12px;
  color: var(--text-tertiary);
  margin: 0 0 12px;
}

.calc-verdict {
  border-radius: var(--radius-md);
  padding: 14px 16px;
  margin: 12px 0;
  text-align: center;
  font-size: 16px;
  font-weight: 500;
}

.calc-verdict.v-ok {
  background: var(--success-bg);
  color: var(--success-text);
}

.calc-verdict.v-warn {
  background: var(--warning-bg);
  color: var(--warning-text);
}

.calc-verdict.v-bad {
  background: var(--danger-bg);
  color: var(--danger-text);
}

.calc-verdict.v-none {
  background: var(--bg-secondary);
  color: var(--text-tertiary);
  font-weight: 400;
  font-size: 14px;
}

.calc-hint {
  font-size: 13px;
  color: var(--text-secondary);
  margin: -8px 0 12px;
  text-align: center;
  padding: 8px 12px;
  background: var(--bg-secondary);
  border-radius: var(--radius-md);
}

.calc-stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.calc-stat {
  background: var(--bg-secondary);
  border-radius: var(--radius-md);
  padding: 12px;
}

.calc-stat-label {
  font-size: 12px;
  color: var(--text-secondary);
  margin: 0 0 2px;
}

.calc-stat-value {
  font-size: 18px;
  font-weight: 500;
  margin: 0;
}

.calc-stat-value.neg {
  color: var(--danger-text);
}

.calc-title {
  font-size: 20px;
  font-weight: 500;
  margin: 0 0 16px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.calc-title-icon {
  width: 28px;
  height: 28px;
  background: var(--info-bg);
  border-radius: var(--radius-md);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--info-text);
  font-size: 16px;
  font-weight: 500;
}

.calc-reset {
  font-size: 13px;
  color: var(--text-tertiary);
  background: transparent;
  border: none;
  cursor: pointer;
  padding: 6px 10px;
  margin-left: auto;
  border-radius: var(--radius-md);
  font-family: inherit;
}

.calc-reset:active {
  background: var(--bg-secondary);
}

.calc-header-row {
  display: flex;
  align-items: center;
  margin-bottom: 16px;
}

.calc-memory-note {
  font-size: 11px;
  color: var(--text-tertiary);
  text-align: center;
  margin-top: 8px;
}

/* iOS Safari 数字入力の矢印を消す */
input[type="number"]::-webkit-outer-spin-button,
input[type="number"]::-webkit-inner-spin-button {
  -webkit-appearance: none;
  margin: 0;
}

input[type="number"] {
  -moz-appearance: textfield;
}
</style>
</head>
<body>

<div class="calc-root">
  <div class="calc-header-row">
    <h1 class="calc-title"><span class="calc-title-icon">¥</span>せどり仕入れ電卓</h1>
    <button class="calc-reset" id="reset-btn">リセット</button>
  </div>

  <div class="calc-section">
    <p class="calc-section-title">販売側</p>
    <label class="calc-label">販売想定価格</label>
    <div class="calc-row">
      <input type="number" id="sell-price" placeholder="18000" min="0" step="100" inputmode="numeric" pattern="[0-9]*">
      <span class="calc-unit">円</span>
    </div>
    <label class="calc-label">販売送料</label>
    <div class="calc-row">
      <input type="number" id="ship-out" placeholder="850" min="0" step="10" inputmode="numeric" pattern="[0-9]*">
      <span class="calc-unit">円</span>
      <select id="ship-out-preset">
        <option value="">選択</option>
        <option value="210">210</option>
        <option value="450">450</option>
        <option value="750">750</option>
        <option value="850">850</option>
        <option value="1100">1100</option>
        <option value="1500">1500</option>
      </select>
    </div>
    <label class="calc-label">手数料</label>
    <div class="calc-row">
      <input type="number" id="fee" placeholder="10" min="0" max="100" step="0.1" value="10" inputmode="decimal">
      <span class="calc-unit">%</span>
      <select id="fee-preset">
        <option value="">選択</option>
        <option value="10">10</option>
        <option value="8.8">8.8</option>
        <option value="5">5</option>
      </select>
    </div>
  </div>

  <div class="calc-section">
    <p class="calc-section-title">仕入れ側</p>
    <label class="calc-label">仕入れ値</label>
    <div class="calc-row">
      <input type="number" id="buy-price" placeholder="7500" min="0" step="100" inputmode="numeric" pattern="[0-9]*">
      <span class="calc-unit">円</span>
    </div>
    <label class="calc-label">仕入れ時送料（電脳の場合）</label>
    <div class="calc-row">
      <input type="number" id="ship-in" placeholder="0" min="0" step="10" inputmode="numeric" pattern="[0-9]*">
      <span class="calc-unit">円</span>
    </div>
  </div>

  <div class="calc-result-card">
    <p class="calc-limit-label">仕入れ上限（実質コスト＝商品＋送料）</p>
    <p class="calc-limit-value" id="limit-value">—</p>
    <p class="calc-limit-meta" id="limit-meta">販売想定価格と販売送料を入力してください</p>

    <hr class="calc-divider">

    <div class="calc-cost-row">
      <span style="color: var(--text-secondary);">実質仕入れコスト</span>
      <span id="cost-value" style="font-weight: 500;">—</span>
    </div>
    <p class="calc-cost-meta" id="cost-meta"></p>

    <div class="calc-verdict v-none" id="verdict">仕入れ値を入力すると判定されます</div>
    <div class="calc-hint" id="hint" style="display: none;"></div>

    <div class="calc-stats">
      <div class="calc-stat">
        <p class="calc-stat-label">想定利益</p>
        <p class="calc-stat-value" id="profit-value">—</p>
      </div>
      <div class="calc-stat">
        <p class="calc-stat-label">ROI</p>
        <p class="calc-stat-value" id="roi-value">—</p>
      </div>
    </div>
  </div>

  <p class="calc-memory-note">※ 販売送料・手数料は自動で記憶されます</p>
</div>

<script>
(function() {
  const STORAGE_KEY = 'sedori_calc_prefs_v1';

  const tiers = [
    { name: 'A', min: 0, max: 5000, roi: null, minProfit: null, label: 'A帯（仕入れ不可）' },
    { name: 'B1', min: 5000, max: 10000, roi: 0.30, minProfit: 2250, label: 'B1帯' },
    { name: 'B2', min: 10000, max: 15000, roi: 0.28, minProfit: 3500, label: 'B2帯' },
    { name: 'C', min: 15000, max: 35000, roi: 0.22, minProfit: 5000, label: 'C帯' },
    { name: 'D', min: 35000, max: 80000, roi: 0.18, minProfit: 8000, label: 'D帯' },
    { name: 'E', min: 80000, max: Infinity, roi: 0.13, minProfit: 15000, label: 'E帯' }
  ];

  const els = {
    sellPrice: document.getElementById('sell-price'),
    shipOut: document.getElementById('ship-out'),
    shipOutPreset: document.getElementById('ship-out-preset'),
    fee: document.getElementById('fee'),
    feePreset: document.getElementById('fee-preset'),
    buyPrice: document.getElementById('buy-price'),
    shipIn: document.getElementById('ship-in'),
    limitValue: document.getElementById('limit-value'),
    limitMeta: document.getElementById('limit-meta'),
    costValue: document.getElementById('cost-value'),
    costMeta: document.getElementById('cost-meta'),
    verdict: document.getElementById('verdict'),
    hint: document.getElementById('hint'),
    profitValue: document.getElementById('profit-value'),
    roiValue: document.getElementById('roi-value'),
    resetBtn: document.getElementById('reset-btn')
  };

  function loadPrefs() {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (!saved) return;
      const prefs = JSON.parse(saved);
      if (prefs.shipOut !== undefined && prefs.shipOut !== '') els.shipOut.value = prefs.shipOut;
      if (prefs.fee !== undefined && prefs.fee !== '') els.fee.value = prefs.fee;
      if (prefs.shipIn !== undefined && prefs.shipIn !== '') els.shipIn.value = prefs.shipIn;
    } catch (e) {}
  }

  function savePrefs() {
    try {
      const prefs = {
        shipOut: els.shipOut.value,
        fee: els.fee.value,
        shipIn: els.shipIn.value
      };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(prefs));
    } catch (e) {}
  }

  function yen(n) {
    if (!isFinite(n)) return '—';
    return '¥' + Math.round(n).toLocaleString();
  }

  function getTier(price) {
    return tiers.find(t => price >= t.min && price < t.max);
  }

  function resetResults(msg) {
    els.limitValue.textContent = '—';
    els.limitMeta.textContent = msg;
    els.costValue.textContent = '—';
    els.costMeta.textContent = '';
    els.verdict.className = 'calc-verdict v-none';
    els.verdict.textContent = '仕入れ値を入力すると判定されます';
    els.hint.style.display = 'none';
    els.profitValue.textContent = '—';
    els.profitValue.classList.remove('neg');
    els.roiValue.textContent = '—';
    els.roiValue.classList.remove('neg');
  }

  function compute() {
    savePrefs();

    const sellPriceRaw = els.sellPrice.value;
    const shipOutRaw = els.shipOut.value;
    const feeRaw = els.fee.value;
    const buyPriceRaw = els.buyPrice.value;
    const shipInRaw = els.shipIn.value;

    const sellPrice = parseFloat(sellPriceRaw);
    const shipOut = parseFloat(shipOutRaw);
    const feeRate = parseFloat(feeRaw) / 100;
    const buyPrice = parseFloat(buyPriceRaw);
    const shipIn = parseFloat(shipInRaw) || 0;

    if (!sellPriceRaw || !sellPrice || sellPrice <= 0) {
      resetResults('販売想定価格と販売送料を入力してください');
      return;
    }

    if (!shipOutRaw || isNaN(shipOut)) {
      resetResults('販売送料を入力してください（0なら0と入力）');
      return;
    }

    if (!feeRaw || isNaN(feeRate)) {
      resetResults('手数料を入力してください');
      return;
    }

    const tier = getTier(sellPrice);
    const revenue = sellPrice * (1 - feeRate) - shipOut;

    if (!tier.roi) {
      els.limitValue.textContent = '仕入れ不可';
      els.limitMeta.textContent = tier.label + '（5,000円未満は対象外）';
      els.costValue.textContent = '—';
      els.costMeta.textContent = '';
      els.verdict.className = 'calc-verdict v-bad';
      els.verdict.textContent = '✕ ダメ — A帯は対象外';
      els.hint.style.display = 'none';
      els.profitValue.textContent = '—';
      els.roiValue.textContent = '—';
      return;
    }

    const roiLimit = revenue / (1 + tier.roi);
    const profitLimit = revenue - tier.minProfit;
    const limit = Math.min(roiLimit, profitLimit);
    const binding = roiLimit < profitLimit ? 'ROI ' + Math.round(tier.roi * 100) + '%' : '最低利益 ' + tier.minProfit.toLocaleString() + '円';

    if (limit <= 0) {
      els.limitValue.textContent = '仕入れ不可';
      els.limitMeta.textContent = tier.label + '・' + binding + '・手数料と送料を引くと赤字';
    } else {
      els.limitValue.textContent = yen(limit);
      els.limitMeta.textContent = tier.label + '・' + binding + 'が効いている';
    }

    if (buyPriceRaw && buyPrice > 0) {
      const realCost = buyPrice + shipIn;
      els.costValue.textContent = yen(realCost);
      if (shipIn > 0) {
        els.costMeta.textContent = '商品 ' + yen(buyPrice) + ' + 仕入れ送料 ' + yen(shipIn);
      } else {
        els.costMeta.textContent = '';
      }

      const profit = revenue - realCost;
      const roi = realCost > 0 ? (profit / realCost) * 100 : 0;
      els.profitValue.textContent = yen(profit);
      els.profitValue.classList.toggle('neg', profit < 0);
      els.roiValue.textContent = isFinite(roi) ? roi.toFixed(1) + '%' : '—';
      els.roiValue.classList.toggle('neg', roi < 0);

      if (limit <= 0) {
        els.verdict.className = 'calc-verdict v-bad';
        els.verdict.textContent = '✕ ダメ — この販売価格では利益が出ない';
        els.hint.style.display = 'none';
      } else if (realCost <= limit) {
        els.verdict.className = 'calc-verdict v-ok';
        els.verdict.textContent = '〇 いける — 基準クリア';
        const margin = limit - realCost;
        const marginPct = Math.round((realCost / limit) * 100);
        els.hint.style.display = 'block';
        els.hint.textContent = '余裕 ' + yen(margin) + '（上限の' + marginPct + '%で仕入れ）';
      } else if (realCost <= limit * 1.1) {
        els.verdict.className = 'calc-verdict v-warn';
        els.verdict.textContent = '△ ギリギリ — 基準を ' + Math.round((realCost / limit - 1) * 100) + '% 超過';
        const downAmount = realCost - limit;
        els.hint.style.display = 'block';
        els.hint.textContent = 'あと ' + yen(downAmount) + ' 下げれば〇';
      } else {
        els.verdict.className = 'calc-verdict v-bad';
        els.verdict.textContent = '✕ ダメ — 基準を ' + Math.round((realCost / limit - 1) * 100) + '% 超過';
        const downAmount = realCost - limit;
        els.hint.style.display = 'block';
        els.hint.textContent = 'あと ' + yen(downAmount) + ' 下げれば〇';
      }
    } else {
      els.costValue.textContent = '—';
      els.costMeta.textContent = '';
      els.verdict.className = 'calc-verdict v-none';
      els.verdict.textContent = '仕入れ値を入力すると判定されます';
      els.hint.style.display = 'none';
      els.profitValue.textContent = '—';
      els.profitValue.classList.remove('neg');
      els.roiValue.textContent = '—';
      els.roiValue.classList.remove('neg');
    }
  }

  ['sellPrice', 'shipOut', 'fee', 'buyPrice', 'shipIn'].forEach(key => {
    els[key].addEventListener('input', compute);
  });

  els.shipOutPreset.addEventListener('change', e => {
    if (e.target.value) {
      els.shipOut.value = e.target.value;
      compute();
      e.target.value = '';
    }
  });

  els.feePreset.addEventListener('change', e => {
    if (e.target.value) {
      els.fee.value = e.target.value;
      compute();
      e.target.value = '';
    }
  });

  els.resetBtn.addEventListener('click', () => {
    els.sellPrice.value = '';
    els.buyPrice.value = '';
    compute();
  });

  loadPrefs();
  compute();
})();
</script>

</body>
</html>
